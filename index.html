<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mister Lu · NFL</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="outfit.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Outfit";src:url("outfit.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --ink:#111111; --ink2:#3a3a3a; --mut:#6e6e6e; --mut2:#9a9a9a;
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.82); --gline:rgba(255,255,255,.9); --gshade:rgba(0,0,0,.18);
  --blue:#111111; --blue2:#3d3d3d; --deep:#000000; --ice:#f1f1f1; --frost:#dcdcdc;
  --teal:#111111; --neon:#d62828;
  --c-blue:#222222; --c-green:#1e8a4a; --c-orange:#111111; --c-red:#d62828; --c-purple:#555555; --c-yellow:#a88400;
  --pos:#1e8a4a; --neg:#c62839; --edge2:rgba(0,0,0,.12);
  --f:'Outfit','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);font:15px/1.42 var(--f);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));background:#e9e9e9}
/* fundo: pista de gelo azul, desfocada, com luz por cima (como a referência) */
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:#111 url("bg.webp") center top / cover no-repeat;transform:translateZ(0)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(235,235,235,0) 22%,rgba(235,235,235,.6) 22%,rgba(238,238,238,.92) 34%,#eeeeee 100%)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--gline);box-shadow:0 10px 30px var(--gshade),inset 0 1px 0 rgba(255,255,255,.9)}
/* topo */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 0 4px;background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.2) 75%,rgba(0,0,0,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .r1{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:0 16px 6px}
.top .face{width:46px;height:46px;flex:0 0 46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand{font:300 1.55rem/1 var(--f);color:#fff;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.brand b{font-weight:800}
.brand small{display:block;font:500 .6rem/1.5 var(--f);letter-spacing:.22em;white-space:nowrap;color:rgba(255,255,255,.82);text-transform:uppercase}
.grow{flex:1}
.ibtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.25rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.25)}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;max-width:720px;margin:0 auto}
.stats::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 11px 4px 8px;font:600 .84rem var(--f);color:#fff;white-space:nowrap;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.st svg{color:#fff;opacity:.9}
.upd{font:400 .74rem var(--f);color:rgba(255,255,255,.88);padding:0 16px 4px;max-width:720px;margin:0 auto}
/* navegação: pílula de vidro a flutuar */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:2px;width:min(94vw,560px);padding:6px;border-radius:30px;background:rgba(255,255,255,.66);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(0,0,0,.25)}
#nav button{flex:1;position:relative;background:none;border:0;border-radius:24px;color:var(--mut);font:600 .7rem var(--f);min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#nav svg{width:24px;height:24px}
#nav button.on{color:#fff;background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:0 6px 14px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.4)}
#nav .nb{position:absolute;top:4px;right:calc(50% - 22px);background:var(--neon);color:#fff;border-radius:999px;font:700 .64rem/1 var(--f);padding:3px 6px}
/* painéis de vidro */
.pn{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--gline);border-radius:24px;margin:12px 0;padding:14px 16px;box-shadow:0 10px 30px var(--gshade),inset 0 1px 0 rgba(255,255,255,.9)}
.pn.hl{background:var(--glass2)}
.pn-h{font:600 1.18rem/1.15 var(--f);margin:0 0 4px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.pn-h svg{color:var(--blue)}
.pn-h .r{margin-left:auto;font:400 .78rem var(--f);color:var(--mut)}
.div{height:1px;margin:6px 0 10px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.14),transparent)}
.muted{color:var(--mut)} .small{font-size:.82rem} .pos{color:var(--pos)} .neg{color:var(--neg)}
/* separadores (pílulas, como «Movements / Game Starts») */
.tabs{display:flex;gap:4px;margin:12px 0 0;padding:4px;border-radius:999px;background:rgba(255,255,255,.5);border:1px solid var(--gline);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px var(--gshade)}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font:500 .9rem var(--f);color:var(--ink2);cursor:pointer;min-height:40px}
.tabs button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.35)}
/* faixa de datas */
.dates{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 62px;height:76px;border-radius:18px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:300 1.2rem/1 var(--f)}
.dates button small{font:500 .6rem var(--f);text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);text-align:center;line-height:1.15}
.dates button.on{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.dates button.on b{display:flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;font:700 1.05rem var(--f)}
.dates button b{font-weight:inherit}
/* categorias e barras */
.cat{display:flex;align-items:center;gap:8px;font:600 .92rem var(--f);margin:16px 0 8px;color:var(--ink)}
.cat svg{color:var(--k,var(--blue));width:19px;height:19px}
.at{margin:0 0 11px}
.at .l{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--ink2);margin-bottom:5px}
.at .v{font:700 .98rem var(--f);white-space:nowrap;color:var(--ink)}
.at .v small{font-weight:400;color:var(--mut)}
.bar{height:8px;border-radius:999px;background:rgba(0,0,0,.09);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--k,var(--blue))}
.bar.two i+i{left:auto;right:0}
/* números grandes em mosaico (81% · 78% · 92%) */
.ovr{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 8px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid var(--gline);line-height:1;box-shadow:0 4px 12px var(--gshade)}
.ovr b{font:700 1.3rem/1 var(--f);color:var(--ink)}
.ovr small{font:500 .58rem var(--f);letter-spacing:.08em;color:var(--mut);margin-top:2px}
.big-ovr{display:flex;align-items:center;gap:12px}
.big-ovr .t{font:500 1rem var(--f)}
.big-ovr .n{font:700 2.4rem/1 var(--f);padding:6px 16px;border-radius:20px;background:#fff;color:var(--blue);box-shadow:0 8px 20px var(--gshade)}
.ruler{display:none}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:500 .95rem var(--f);border:1px solid var(--gline);border-radius:999px;background:rgba(255,255,255,.62);padding:10px 16px;min-height:46px;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px var(--gshade)}
.btn:active{transform:translateY(1px)}
.btn.go{color:var(--blue);background:rgba(255,255,255,.82)}
.btn.fill{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.red{color:var(--neg);background:rgba(255,255,255,.75)}
.btn.full{width:100%}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.8rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.row.w{flex-wrap:wrap}
/* herói (como «Advance Your Game») */
.hero{position:relative;overflow:hidden;padding:18px 18px 16px;min-height:200px;background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.65);color:#fff}
.hero .tag{display:inline-block;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.7);color:#fff;font:500 .68rem/1 var(--f);text-transform:uppercase;letter-spacing:.28em;padding:6px 12px;border-radius:999px}
.hero .big{font:200 2.6rem/1 var(--f);margin:14px 0 6px;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.3)}
.hero .big b{font-weight:800}
.hero .sub{font-size:.88rem;color:rgba(255,255,255,.92);max-width:58%;line-height:1.38;min-height:2.7em}
.hero .kpis{margin-top:18px;position:relative;z-index:1}
.hero .face{position:absolute;right:4px;top:10px;width:130px;height:130px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:rgba(255,255,255,.72);border:1px solid var(--gline);border-radius:18px;padding:10px 8px;text-align:center;color:var(--ink);box-shadow:0 6px 16px var(--gshade)}
.kpi b{display:block;font:700 1.45rem/1.05 var(--f)}
.kpi small{display:block;font:400 .66rem var(--f);color:var(--mut);margin-top:3px;order:2}
.kpi{display:flex;flex-direction:column-reverse}
/* boletim */
.leg{display:grid;grid-template-columns:26px 1fr 80px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge2)}
.leg:last-child{border-bottom:0}
.leg input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.leg .t{font:600 1rem/1.2 var(--f)}
.leg .g{font-size:.76rem;color:var(--mut)}
.leg .p{font:600 .8rem var(--f);color:var(--blue)}
.leg input.od{width:100%;background:#fff;border:1px solid var(--frost);border-radius:12px;padding:8px 6px;color:var(--ink);font:700 1rem var(--f);text-align:center}
.leg input.od.est{color:var(--mut2);background:rgba(255,255,255,.5);border-style:dashed}
.sum{margin-top:10px;padding:12px;border-radius:18px;background:rgba(240,240,240,.92);border:1px solid var(--frost)}
.sum .n{display:flex;justify-content:space-between;align-items:baseline}
.sum .n b{font:700 1.5rem var(--f)}
.pick{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--edge2)}
.pick:last-child{border-bottom:0}
.pick .g{font:500 .72rem var(--f);color:var(--mut);letter-spacing:.02em}
.pick .l{font:600 1.02rem/1.2 var(--f)}
.pick .o{margin-left:auto;text-align:right;font:700 1.3rem/1 var(--f);color:var(--ink)}
.pick .o small{display:block;font:500 .72rem var(--f);color:var(--pos)}
.tg{display:inline-block;padding:2px 8px;border-radius:999px;font:600 .66rem var(--f);letter-spacing:.03em;border:1px solid var(--k,var(--edge2));color:var(--k,var(--mut));background:rgba(255,255,255,.6)}
/* cartão de jogo «VS» com etiqueta recortada */
.gc{position:relative;margin:26px 0 12px;cursor:pointer;padding:22px 14px 14px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--gline);box-shadow:0 10px 30px var(--gshade),inset 0 1px 0 rgba(255,255,255,.9)}
.gc .notch{position:absolute;left:50%;top:-14px;transform:translateX(-50%);min-width:56%;max-width:86%;padding:6px 18px;text-align:center;font:500 .76rem var(--f);color:var(--ink2);background:rgba(246,246,246,.97);border:1px solid var(--gline);border-radius:0 0 16px 16px / 0 0 14px 14px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);box-shadow:0 4px 10px var(--gshade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .notch .live{margin-right:6px}
.gc .hd{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--neon);font-weight:600}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--neon);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.gc .tm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 2px 4px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.team.r{flex-direction:column}
.team .nm{font:600 .98rem/1.1 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.team .nm.lg{font-size:.88rem} .team .nm.xl{font-size:.78rem}
.team .rc{font:400 .72rem/1.25 var(--f);color:var(--mut);white-space:nowrap}
.logo{flex:0 0 52px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .82rem var(--f);color:#fff;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 -6px 12px rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.logo{position:relative;overflow:hidden}
.logo img+b{visibility:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;background:#fff;border-radius:50%}
.vsx{font:300 1.7rem/1 var(--f);color:var(--ink2);letter-spacing:.04em;position:relative;padding:0 6px}
.vsx:before,.vsx:after{content:"";position:absolute;top:50%;width:22px;height:1px;background:rgba(0,0,0,.25)}
.vsx:before{right:100%}.vsx:after{left:100%}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:10px 4px 2px;padding:10px 12px 8px;border-radius:18px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.82));box-shadow:0 6px 16px var(--gshade)}
.board .n{font:700 1.7rem/1 var(--f);text-align:center}
.board .n small{display:block;font:400 .66rem var(--f);color:var(--mut);margin-top:3px}
.board .c{text-align:center;font:500 .74rem var(--f);color:var(--mut);min-width:84px}
.board .c b{display:block;font:600 .82rem var(--f);color:var(--ink)}
.score{text-align:center;min-width:80px;padding:0 4px}
.score .s{font:700 1.55rem/1 var(--f)}
.score .p{font:500 .68rem var(--f);color:var(--mut)}
.gc .ft{padding:8px 4px 0}
.gc .say{font-size:.88rem;line-height:1.32;margin-top:6px}
.gc .mk{font-size:.76rem;color:var(--mut);margin-top:4px}
/* folha (sobe de baixo, vidro claro) */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;top:max(5vh,env(safe-area-inset-top));overflow-y:auto;background:linear-gradient(180deg,rgba(248,248,248,.98),rgba(236,236,236,.98));border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;box-shadow:0 -14px 40px rgba(0,0,0,.3)}
#sheet .box:before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:rgba(0,0,0,.18);margin:0 auto 6px}
#sheet .box.short{top:auto;max-height:90vh}
#sheet .sh{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
#sheet .sh h3{margin:0;font:500 1.35rem/1.1 var(--f);flex:1}
#sheet .x{width:42px;height:42px;border-radius:50%;border:1px solid var(--gline);background:rgba(255,255,255,.8);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px var(--gshade)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font:500 .72rem var(--f);color:var(--mut);text-align:right;padding:6px 4px;border-bottom:1px solid var(--edge2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--edge2)}
.tbl tr.best td{background:rgba(0,0,0,.08)}
.tbl tr.tap{cursor:pointer}
label.f{display:block;font:500 .78rem var(--f);color:var(--mut);margin:12px 0 5px}
input.in,select.in{width:100%;background:#fff;border:1px solid var(--frost);border-radius:14px;padding:11px 12px;color:var(--ink);font:600 1.05rem var(--f)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--gline)}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font:500 .86rem var(--f);color:var(--ink2);cursor:pointer;min-height:42px}
.seg button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.32)}
.opinion{margin-top:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid var(--gline);border-left:4px solid var(--k,var(--frost))}
.opinion .face{width:52px;height:52px;flex:0 0 52px}
.opinion.good{--k:var(--pos)} .opinion.bad{--k:var(--neg)}
.form{display:inline-flex;gap:3px}
.form i{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 .6rem var(--f);font-style:normal}
.form .w{background:rgba(15,157,99,.16);color:var(--pos)} .form .l{background:rgba(214,51,74,.14);color:var(--neg)} .form .o{background:rgba(224,168,0,.16);color:#a37a00}
.cta{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:14px -16px calc(-20px - env(safe-area-inset-bottom));padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(236,236,236,0),rgba(236,236,236,.97) 32%)}
/* contas / duelo */
.bet{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--edge2)}
.bet:last-child{border-bottom:0}
.bet .who{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--k)}
.bet .m{flex:1;min-width:0}
.bet .t{font:600 .98rem/1.2 var(--f)}
.bet .g{font-size:.76rem;color:var(--mut)}
.bet .legs{font-size:.78rem;color:var(--ink2);margin-top:3px;line-height:1.38}
.bet .v{text-align:right;font:700 1.02rem/1.15 var(--f);white-space:nowrap}
.bet .v small{display:block;font:400 .72rem var(--f);color:var(--mut)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}

<script>

/* ---------- utilitários ---------- */

/* ---------- as 32 equipas (abreviatura do nflverse; a ESPN usa algumas diferentes) ---------- */
const TEAMS = {

  MIN: ['Minnesota', 'Vikings', '4f2683', 'ffc62f'], NE: ['New England', 'Patriots', '002244', 'c60c30'], NO: ['New Orleans', 'Saints', 'd3bc8d', '101820'], NYG: ['NY Giants', 'Giants', '0b2265', 'a71930'],

};
const ESPN2NFL = { WSH: 'WAS', LAR: 'LA', JAC: 'JAX', OAK: 'LV', SD: 'LAC', STL: 'LA' };
const nflAb = ab => { ab = String(ab || '').toUpperCase(); return TEAMS[ab] ? ab : ESPN2NFL[ab] || null; };
const DIV = { BUF: 'AFC Este', MIA: 'AFC Este', NE: 'AFC Este', NYJ: 'AFC Este', BAL: 'AFC Norte', CIN: 'AFC Norte', CLE: 'AFC Norte', PIT: 'AFC Norte', HOU: 'AFC Sul', IND: 'AFC Sul', JAX: 'AFC Sul', TEN: 'AFC Sul', DEN: 'AFC Oeste', KC: 'AFC Oeste', LV: 'AFC Oeste', LAC: 'AFC Oeste', DAL: 'NFC Este', NYG: 'NFC Este', PHI: 'NFC Este', WAS: 'NFC Este', CHI: 'NFC Norte', DET: 'NFC Norte', GB: 'NFC Norte', MIN: 'NFC Norte', ATL: 'NFC Sul', CAR: 'NFC Sul', NO: 'NFC Sul', TB: 'NFC Sul', ARI: 'NFC Oeste', LA: 'NFC Oeste', SF: 'NFC Oeste', SEA: 'NFC Oeste' };
const AFC = ['BUF', 'MIA', 'NE', 'NYJ', 'BAL', 'CIN', 'CLE', 'PIT', 'HOU', 'IND', 'JAX', 'TEN', 'DEN', 'KC', 'LV', 'LAC'];

/* ---------- guardado ---------- */
const arrOr = v => Array.isArray(v) ? v : [], objOr = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
let DB = LS.get('db', null); if (!DB || !DB.g || !DB.days) DB = { g: {}, days: {} };
let BETS = arrOr(LS.get('bets', [])), PREDS = objOr(LS.get('preds', {})), DEPOS = arrOr(LS.get('depos', [])), SLIPS = objOr(LS.get('slips', {}));
let BO = objOr(LS.get('bo', {}));                // odds da Betano que tu metes (por jogo)
const CFG_DEF = { bank: { tu: 100, lu: 100, pi: 250 }, min: 0.25, piOn: true, piStake: 2.5, evMin: 0.05, mktW: 0.90, mktWt: 0.95, oddMin: 1.30, oddMax: 4.50 };
let CFG = Object.assign({}, CFG_DEF, objOr(LS.get('cfg', {})));
CFG.bank = Object.assign({}, CFG_DEF.bank, CFG.bank || {});
if (CFG.botV !== 1) { CFG.piOn = true; CFG.botV = 1; }   // 1.2: o piloto passou a ser o «Lu sozinho», ligado de origem
const saveDB = () => LS.set('db', DB);
const saveBets = () => LS.set('bets', BETS);
let SEED = null;

/* =====================================================================
   1) IR BUSCAR À ESPN
   ===================================================================== */
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const BRIDGES = [
  { n: 'Direto', f: u => u },
  { n: 'corsproxy.io', f: u => 'https://corsproxy.io/?url=' + encodeURIComponent(u) },
  { n: 'allorigins', f: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) }
];
async function getJSON(url, tmo) {
  const pref = clamp(LS.get('bridge', 0), 0, BRIDGES.length - 1);
  const order = [pref].concat(BRIDGES.map((_, i) => i).filter(i => i !== pref));
  let last = null;
  for (const i of order) {
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), tmo || 15000);
    try {
      const r = await fetch(BRIDGES[i].f(url), { signal: ctrl.signal, cache: 'no-store' });

      if (i !== pref) LS.set('bridge', i);

    } catch (e) { last = e; if (e.status === 400 || e.status === 404) throw e; }

}
const scoreVal = x => x == null ? null : typeof x === 'object' ? Number(x.value != null ? x.value : x.displayValue) : Number(x);
function pickSide(s) { return s ? (s.close || s.current || s.open || s) : null; }

/* odds da ESPN: vencedor, handicap (linha da casa: negativa = casa favorita) e total — tudo conta prolongamento */
function parseOdds(o, hab, aab) {
  if (!o) return null;
  const r = { p: (o.provider && o.provider.name) || 'casa' };
  let hl = null, tl = null;
  try {
    const ps = o.pointSpread;
    if (ps && ps.home) { const x = pickSide(ps.home), y = pickSide(ps.away); if (x && x.line != null) hl = num(x.line); r.hso = american(x && x.odds); r.aso = american(y && y.odds); }
    const T = o.total;
    if (T && T.over) { const x = pickSide(T.over), y = pickSide(T.under); if (x && x.line != null) tl = num(String(x.line).replace(/^[ou]/i, '')); r.ovo = american(x && x.odds); r.uno = american(y && y.odds); }
    const ML = o.moneyline;
    if (ML && ML.home) { r.hml = american(pickSide(ML.home) && pickSide(ML.home).odds); r.aml = american(pickSide(ML.away) && pickSide(ML.away).odds); }
  } catch (e) {}
  if (hl == null && o.details) {   // formato antigo: «KC -6.5»
    const m = String(o.details).match(/^([A-Z]{2,4})\s+([+-]?\d+(?:\.\d+)?)/);
    if (m && Math.abs(+m[2]) < 30) { const v = Math.abs(+m[2]), ab = nflAb(m[1]); hl = ab === hab ? -v : ab === aab ? v : null; }
    else if (/\b(EVEN|PK|PICK)\b/i.test(o.details)) hl = 0;
  }
  if (hl == null && o.spread != null && o.homeTeamOdds) { const v = Math.abs(+o.spread); if (o.homeTeamOdds.favorite) hl = -v; else if (o.awayTeamOdds && o.awayTeamOdds.favorite) hl = v; }
  if (tl == null && o.overUnder != null) tl = num(o.overUnder);
  const H = o.homeTeamOdds || {}, A = o.awayTeamOdds || {};
  if (!r.hml && H.moneyLine != null) r.hml = american(H.moneyLine);
  if (!r.aml && A.moneyLine != null) r.aml = american(A.moneyLine);
  if (!r.hso && H.spreadOdds != null) r.hso = american(H.spreadOdds);
  if (!r.aso && A.spreadOdds != null) r.aso = american(A.spreadOdds);
  if (!r.ovo && o.overOdds != null) r.ovo = american(o.overOdds);
  if (!r.uno && o.underOdds != null) r.uno = american(o.underOdds);
  r.hl = hl != null && Math.abs(hl) < 30 ? hl : null;
  r.tl = tl != null && tl > 25 && tl < 75 ? tl : null;
  Object.keys(r).forEach(k => { if (r[k] == null) delete r[k]; });
  return (r.hl != null || r.tl != null || r.hml) ? r : null;
}
function ingest(ev) {
  const c = ev && ev.competitions && ev.competitions[0];
  if (!c || !c.competitors) return null;
  const H = c.competitors.find(x => x.homeAway === 'home'), A = c.competitors.find(x => x.homeAway === 'away');
  if (!H || !A || !H.team || !A.team) return null;
  const h = nflAb(H.team.abbreviation), a = nflAb(A.team.abbreviation);
  if (!h || !a) return null;                                                     // Pro Bowl e afins
  const ty = ev.season && ev.season.type;
  if (ty && [2, 3].indexOf(Number(ty)) < 0) return null;                         // só época regular e playoffs
  DB.logos = DB.logos || {}; [[h, H.team], [a, A.team]].forEach(([k, t]) => { const u = t.logo || (t.logos && t.logos[0] && t.logos[0].href); if (u && /^https:\/\//.test(u)) DB.logos[k] = u; });
  const S = (c.status || ev.status || {}), st = S.type || {};
  const off = /POSTPON|CANCEL|SUSPEND/i.test(String(st.name || '') + ' ' + String(st.description || ''));
  const s = off ? 'off' : (st.completed || st.state === 'post') ? 'post' : st.state === 'in' ? 'in' : 'pre';
  const id = String(ev.id), old = DB.g[id];
  const g = { id, d: ev.date || c.date, h, a, s, ty: Number(ty) || 2, wk: ev.week && ev.week.number ? (Number(ty) === 3 ? 18 + Math.min(4, Number(ev.week.number)) : Number(ev.week.number)) : (old && old.wk) || null, src: 'espn', neu: !!c.neutralSite };
  g.ed = etYmd(new Date(g.d));
  if (s === 'post' || s === 'in') { g.hs = scoreVal(H.score); g.as = scoreVal(A.score); g.per = Number(S.period) || 0; g.cl = st.shortDetail || st.detail || ''; g.ot = s === 'post' && (g.per > 4 || /OT/i.test(g.cl)); }
  const o = parseOdds(c.odds && c.odds[0], h, a);
  g.o = s === 'pre' ? (o || (old && old.o) || null) : ((old && old.o) || o || null);
  if (!g.o) delete g.o;
  DB.g[id] = g;
  return g;
}
let BUSY = false;
async function refresh() {
  if (BUSY || !SEED) return; BUSY = true;
  const btn = $('#btnRefresh'); if (btn) btn.classList.add('spin'); document.body.classList.add('busy');
  const T = todayET(), end = ymdAdd(T, 12);
  const cut = SEED.cut.replace(/-/g, '');
  let fails = 0, got = 0;
  try {
    // dia a dia desde o fim do arquivo até daqui a 12 dias (a semana NFL inteira e a seguinte: quinta, domingo e segunda)
    let d = ymdAdd(cut, 1); if (d < ymdAdd(T, -380)) d = ymdAdd(T, -380);
    for (let i = 0; d <= end && i < 420; i++, d = ymdAdd(d, 1)) {
      if (DB.days[d] && d < ymdAdd(T, -2)) continue;
      setUpd(`⏳ A buscar ${d.slice(6)}/${d.slice(4, 6)} à ESPN…`);
      try { const j = await getJSON(`${ESPN}/scoreboard?dates=${d}`); if (!j || !Array.isArray(j.events)) throw new Error('resposta sem jogos'); j.events.forEach(e => { if (ingest(e)) got++; }); if (d < ymdAdd(T, -2) && !stuckBetween(d, d)) DB.days[d] = 1; }
      catch (e) { fails++; if (i >= 2 && !got && fails >= i + 1) break; }
      await new Promise(r => setTimeout(r, 60));
    }
    saveDB();

/* =====================================================================
   🛡️ BOLETIM SEGURO DA SEMANA: seleções com ≥85% (e ≤95%), juntas enquanto

const SAFE_LEG = 0.85, SAFE_SLIP = 0.70;

function upcomingWeek() {

  const nx = G.find(g => g.s !== 'post' && new Date(g.d).getTime() > now - 5 * 3600e3) || G[G.length - 1];
  return nx ? { wk: nx.wk, sy: seasonOf(nx.ed) } : null;
}
function safeCands(wkOff) {
  const now = Date.now(), out = [];
  weekGames(wkOff || 0).filter(g => g.s === 'pre' && new Date(g.d).getTime() > now + 10 * 60e3).forEach(g => {
    const P = predict(g), opts = [], favH = P.m >= 0, dog = favH ? 'a' : 'h', fav = favH ? 'h' : 'a', base = Math.abs(P.m);
    [7.5, 10.5, 13.5].forEach(L => { const ln = Math.round(L + base) - 0.5; if (ln <= 17.5) opts.push({ mk: 'sp', sel: dog, line: ln }); });
    [1.5, 3.5, 6.5].forEach(L => opts.push({ mk: 'sp', sel: fav, line: L }));
    opts.push({ mk: 'ml', sel: fav, line: null });
    [10.5, 13.5].forEach(L => { opts.push({ mk: 'tot', sel: 'o', line: Math.round(P.t - L) + 0.5 }); opts.push({ mk: 'tot', sel: 'u', line: Math.round(P.t + L) - 0.5 }); });
    opts.forEach(x => { x.p = probs(P, x.mk, x.sel, x.line).w; });
    bossPool(g, opts);
    const best = opts.filter(x => x.p >= SAFE_LEG && x.p <= 0.95).sort((a, b) => a.p - b.p)[0];
    if (best) out.push(Object.assign(best, { g, odd: r2(Math.max(1.02, 1 / (best.p * 1.06))), est: true, lb: selLabel(g, best.mk, best.sel, best.line) }));

}

  const ks = Object.keys(L); if (ks.length > 500) ks.sort((a, b) => L[a].t - L[b].t).slice(0, ks.length - 500).forEach(k => delete L[k]);

  opts.forEach(x => { const p = x.c != null ? x.c : x.p; if (p >= 0.80 && p <= 0.985) BPOOL.push({ g, mk: x.mk, sel: x.sel, line: x.line == null ? null : x.line, p, odd: x.odd || null, est: x.est !== false }); });
}
function bossFeed() {
  try {
    const F = LS.get('boss', null) || { v: 1, legs: {} }, now = Date.now();
    const gameOf = id => DB.g[id], segOf = g => ({ lg: 'NFL' }), glOf = g => gLabel(g);
    BPOOL = []; [0].forEach(d => { try { safeCands(d); } catch (e) {} }); const pool = BPOOL; BPOOL = null;
    Object.values(DB.g).filter(g => g && g.s === 'pre' && new Date(g.d).getTime() > now && new Date(g.d).getTime() < now + 8 * 864e5).forEach(g => {
      try { const v = predict(g).value; if (v) pool.push({ g, mk: v.mk, sel: v.sel, line: v.line == null ? null : v.line, p: v.p, odd: v.odd, est: false, val: r2(v.ev) }); } catch (e) {}

      if (!L) F.legs[id] = rec; else if (L.st === 'open' && new Date(L.d).getTime() > now) Object.assign(L, { p: rec.p, odd: rec.odd, est: rec.est, val: rec.val, t: now });
    });
    Object.values(F.legs).forEach(l => { if (l.st !== 'open') return; const g = gameOf(l.g); if (!g) return; let r = null; try { r = outcome(l, g); } catch (e) {} if (r) { l.st = r; l.tset = now; } });

  el.innerHTML = `<div class="n"><span>${L.length} seleç${L.length === 1 ? 'ão' : 'ões'} · Lu dá <b style="font-size:1.1rem">${pct(P)}</b></span><b>@ ${odd2(O)}</b></div>
   <div class="small ${ev >= 0 ? 'pos' : 'muted'}">${ev >= 0 ? 'Com estas odds o boletim tem valor ' + sPct(ev) : 'Paga ' + Math.abs(Math.round(ev * 100)) + '% menos do que o justo (normal nas seguras)'}</div>
   <div class="row" style="margin-top:8px"><div style="flex:1"><label class="f" style="margin-top:0">Montante (€)</label><input class="in" id="ssStake" inputmode="decimal" value="${String(SS.stake).replace('.', ',')}" oninput="SS.stake=num(this.value)"></div></div>
   <div class="row" style="margin-top:8px"><button class="btn fill full" onclick="placeSlip()">${ic('check')} Registar múltipla</button><button class="btn go" onclick="shareSlip()" aria-label="Partilhar">${ic('share')}</button></div>`;
}
function placeSlip() {
  const L = ssLegs(); const stake = num(($('#ssStake') || {}).value);
  if (!L.length) return toast('Escolhe as seleções');
  if (L.some(x => !x.real)) return toast('Mete a odd da Betano em todas as seleções (as cinzentas são só estimativa)');
  if (L.some(x => !canBet(x.c.g))) return toast('Um dos jogos já começou');
  if (!(stake >= CFG.min)) return toast('A aposta mínima é ' + eur(CFG.min));
  if (stake > accStats('tu').bal) return toast('Não tens saldo para isso');
  const duel = 'd' + Date.now().toString(36), P = L.reduce((a, x) => a * x.c.p, 1);
  newMulti('tu', L.map(x => safeLeg(x.c, x.odd)), stake, { duel, src: 'seguro', p: r2(P) });
  let mine = SS.C.filter(c => SS.auto.has(legKey(c)));
  let same = mine.length === L.length && L.every(x => SS.auto.has(legKey(x.c)));
  let follow = false;
  if (!mine.every(c => SS.odd[legKey(c)] > 1 && canBet(c.g))) { mine = L.map(x => x.c); same = true; follow = true; }   // sem odds reais nas dele, vai no teu
  const tstake = Math.min(stake, accStats('lu').bal);
  let msg, mood = 'win';
  if (mine.length && tstake >= CFG.min) {
    newMulti('lu', mine.map(c => safeLeg(c, SS.odd[legKey(c)])), tstake, { duel, src: 'seguro', p: r2(mine.reduce((a, c) => a * c.p, 1)) });
    msg = follow ? 'Só tenho odds reais nas tuas seleções: vou contigo no teu boletim.' : same ? 'É o meu boletim. Vou contigo!' : `Mexeste no boletim. Eu fico com o meu: <b>${mine.map(c => esc(c.lb)).join(' + ')}</b>.`;
  } else { BETS.push({ id: 'gp' + Date.now().toString(36), acc: 'lu', g: L[0].c.g.id, gl: '', gd: L[0].c.g.d, mk: 'pass', stake: 0, odd: 0, t: Date.now(), st: 'pass', ret: 0, lb: 'Passou', duel }); msg = 'Estou sem saldo… passo esta.'; mood = 'sad'; }
  saveBets();
  openSheet('Duelo marcado', duelBox(duel, mood, msg), true);
  render();
}
function shareSlip() {
  const L = ssLegs(); if (!L.length) return;
  const P = L.reduce((a, x) => a * x.c.p, 1), O = L.reduce((a, x) => a * x.odd, 1);
  shareText(`🏈 Boletim seguro do Mister Lu · ${new Date(L[0].c.g.d).toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' })}\n` + L.map((x, i) => `${i + 1}) ${x.c.lb} @ ${odd2(x.odd)} (${x.c.g.h}–${x.c.g.a}, ${hhmm(x.c.g.d)})`).join('\n') + `\nOdd total ${odd2(O)} · o Lu dá ${pct(P)}\n(simulação, sem dinheiro real)`);
}
async function shareText(txt) {
  try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(txt); toast('Copiado! Cola no WhatsApp ou no Facebook.'); } catch (e) { window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank'); }
}

  } else if (g.s === 'off') { notch = 'Adiado'; board = ''; }

  const mine = BETS.filter(b => b.acc === 'tu' && (b.g === g.id || (b.legs && b.legs.some(l => l.g === g.id)))).length;
  if (mine) tags.push(`<span class="tg" style="--k:var(--c-blue)">${ic('star')} ${mine}</span>`);
  let say, bet = '';
  const v = g.s === 'post' ? verdict(g) : null;
  if (v) {
    say = `${okIc(v.win)} Vencedor: o Lu dava ${esc(tNick(v.fav))} (${pct(v.conf)})${v.sp != null ? ` · handicap ${okIc(v.sp)}` : ''}${v.tot != null ? ` · total ${okIc(v.tot)}` : ''}`;
    bet = v.pk ? `<div class="say"><b>Aposta do Lu:</b> ${esc(v.pk.lb)} @ ${odd2(v.pk.odd)} → ${v.pkr === 'won' ? `<b class="pos">ganhou ${unitsTxt(v.pku)}</b>` : v.pkr === 'lost' ? `<b class="neg">perdeu</b>` : 'devolvida'}</div>` : `<div class="mk">O Lu não apostou neste jogo.</div>`;

  else h += `<div class="small muted" style="margin-top:10px">Ainda sem odds para comparar.</div>`;
  return h;
}
function saveBO(id) {
  const o = {};
  ['mh', 'ma', 'hl', 'hh', 'ha', 'tl', 'to', 'tu'].forEach(k => { const e = $('#bo_' + k); const v = e ? num(e.value) : null; if (v != null) o[k] = v; });
  ['mh', 'ma', 'hh', 'ha', 'to', 'tu'].forEach(k => { if (o[k] != null && !(o[k] > 1 && o[k] < 60)) delete o[k]; });
  const g = DB.g[id], P = predict(g);
  if ((o.hh || o.ha) && o.hl == null) o.hl = g.o && g.o.hl != null ? g.o.hl : -Math.round(P.m * 2) / 2 - 0.5;
  if ((o.to || o.tu) && o.tl == null) o.tl = g.o && g.o.tl != null ? g.o.tl : Math.round(P.t) + 0.5;
  if (o.hl != null && Math.abs(o.hl) > 40) delete o.hl;
  if (o.tl != null && !(o.tl > 20 && o.tl < 90)) delete o.tl;
  if (Object.keys(o).length) BO[id] = o; else delete BO[id];
  LS.set('bo', BO); PC.delete(id); toast('Odds guardadas'); GT = 'mk'; openGame(id); render();
}

let BF = null;

function readBF() { const nl = BF.mk === 'sp' || BF.mk === 'tot'; BF.line = nl ? num($('#bLine') && $('#bLine').value) : null; BF.odd = num($('#bOdd').value); BF.stake = num($('#bStake').value); }
function betOpinion() {

function placeBet() {

  $('#netBox').innerHTML = `<div class="pn small">${rows.join('<br>')}${best ? `<br><b>A usar: ${BRIDGES[best.i].n}</b>` : '<br><b class="neg">Nenhum caminho funcionou. Tens internet?</b>'}</div>`;
  btn.disabled = false; btn.textContent = 'Testar outra vez';
}

/* ---------- instalar como app ---------- */
let DEFER_INSTALL = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER_INSTALL = e; if (VIEW === 'inicio' || VIEW === 'mais') render(); });
window.addEventListener('appinstalled', () => { DEFER_INSTALL = null; LS.set('instHide', 1); toast('Mister Lu instalado! Já está no teu ecrã.'); render(); });
function installBanner() {
  if (isStandalone() || LS.get('instHide', 0)) return '';
  return `<div class="pn inst"><span style="color:var(--blue)">${ic('phone')}</span><div class="t"><b>Instala o Mister Lu</b><small>Fica no ecrã do telemóvel, como uma app.</small></div><button class="btn fill sm" onclick="doInstall()">Instalar</button><button class="x" onclick="LS.set('instHide',1);render()" aria-label="Fechar">${ic('x')}</button></div>`;
}
const INSTALL_HELP = () => isIOS()
  ? '<p><b>iPhone:</b> abre no <b>Safari</b>, toca em <b>Partilhar</b> (□↑) e escolhe <b>«Adicionar ao ecrã principal»</b>.</p>'
  : '<p><b>Android (Chrome):</b> toca nos <b>⋮</b> em cima à direita e escolhe <b>«Instalar app»</b> ou <b>«Adicionar ao ecrã principal»</b>.</p>';
async function doInstall() {
  if (DEFER_INSTALL) { DEFER_INSTALL.prompt(); try { const r = await DEFER_INSTALL.userChoice; if (r && r.outcome === 'accepted') LS.set('instHide', 1); } catch (e) {} DEFER_INSTALL = null; render(); return; }
  openInstall();
}
function openInstall() {
  openSheet('Instalar como app', isStandalone() ? '<div class="pn">Já estás a usar o Mister Lu como app.</div>' :
    `<div class="pn"><div class="row" style="gap:12px"><div style="width:64px;height:64px;flex:0 0 64px">${luFace('win')}</div><div>Fica com o ícone do Lu no ecrã, abre em ecrã inteiro e funciona mesmo sem internet (só o ↻ precisa de rede).</div></div></div>
     ${DEFER_INSTALL ? `<button class="btn fill full" onclick="doInstall()">${ic('phone')} Instalar agora</button>` : ''}
     <div class="pn">${INSTALL_HELP()}</div>`, true);
}

/* ---------- arranque ---------- */
$('#topFace').innerHTML = luFace('ok');
$('#btnRefresh').innerHTML = ic('refresh');
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== VIEW) { VIEW = v; render(); } });
render();
function loadSeed() {
  fetch('seed.json').then(r => r.json()).then(j => { SEED = j; mergeSeed(); MODEL = null; settleAll(); render(); setTimeout(bossFeed, 50); })
    .catch(() => { $('#view').innerHTML = `<div class="pn empty" style="margin-top:40px"><div class="face">${luFace('sad')}</div>Não consegui abrir o arquivo do Lu.<br><button class="btn fill" style="margin-top:12px" onclick="loadSeed()">${ic('refresh')} Tentar outra vez</button></div>`; });
}
loadSeed();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
</body>
</html>
